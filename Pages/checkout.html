<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MusicStream - Checkout</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/CSS/style.css">
</head>
<body>

<header class="main-header">
    <div class="logo">MusicStream</div>

    <nav class="nav-links">
        <a href="index.html">Discover</a>
        <a href="libreria.html">Library</a>
        <a href="carrito.html" class="active">Store</a>
    </nav>

    <div class="header-actions">
        <input type="text" placeholder="Artists, albums, tracks" class="search-bar">
        <div class="avatar"></div>
    </div>
</header>

<main class="checkout-page">

    <!-- Form section -->
    <section class="checkout-form">

        <h1>Secure Checkout</h1>

        <!-- Payment method -->
        <div class="form-section">
            <h2>Payment Method</h2>

            <div class="payment-options">
                <div class="payment-card active">💳 Credit Card</div>
                <div class="payment-card">💰 PayPal</div>
            </div>

            <div class="form-group">
                <label>Card Number</label>
                <input type="text" placeholder="1234 5678 9012 3456">
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Expiration</label>
                    <input type="text" placeholder="MM/YY">
                </div>

                <div class="form-group">
                    <label>CVV</label>
                    <input type="text" placeholder="123">
                </div>
            </div>
        </div>

        <!-- Billing addres -->
        <div class="form-section">
            <h2>Billing Address</h2>

            <div class="form-group">
                <label>Full Name</label>
                <input type="text" placeholder="John Doe">
            </div>

            <div class="form-group">
                <label>Address</label>
                <input type="text" placeholder="Street address">
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>City</label>
                    <input type="text" placeholder="City">
                </div>

                <div class="form-group">
                    <label>ZIP Code</label>
                    <input type="text" placeholder="ZIP">
                </div>
            </div>
        </div>

    </section>

    <!-- Order summary -->
    <aside class="checkout-summary">

        <h2>Order Summary</h2>

        <div class="summary-line">
            <span>Cosmic Echoes</span>
            <span>$14.99</span>
        </div>

        <div class="summary-line">
            <span>Tax</span>
            <span>$1.20</span>
        </div>

        <div class="summary-line total">
            <span>Total</span>
            <span>$16.19</span>
        </div>

        <a href="succes.html" class="btn-primary checkout-btn">
            Place Order
        </a>

    </aside>

</main>

</body>
</html>

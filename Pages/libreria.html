<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MusicStream - My Library</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header class="main-header">
    <div class="logo">MusicStream</div>

    <nav class="nav-links">
        <a href="index.html">Discover</a>
        <a href="library.html" class="active">Library</a>
        <a href="cart.html">Store</a>
    </nav>

    <div class="header-actions">
        <input type="text" placeholder="Artists, albums, tracks" class="search-bar">
        <div class="avatar"></div>
    </div>
</header>

<main class="library-page">

    <!-- sidebar -->
    <aside class="library-sidebar">
        <h3>My Music</h3>
        <ul>
            <li class="active">Recently Purchased</li>
            <li>My Albums</li>
            <li>Liked Songs</li>
        </ul>
    </aside>

    <!-- content -->
    <section class="library-content">

        <h1>Recently Purchased</h1>

        <div class="album-grid">

            <div class="album-card">
                <div class="album-cover"></div>
                <h3>Cosmic Echoes</h3>
                <p>Nova Pulse</p>
            </div>

            <div class="album-card">
                <div class="album-cover"></div>
                <h3>Neon Horizons</h3>
                <p>Stellar Drift</p>
            </div>

        </div>

    </section>

</main>

</body>
</html>

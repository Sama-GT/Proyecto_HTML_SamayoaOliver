<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MusicStream - Player</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header class="main-header">
    <div class="logo">MusicStream</div>

    <nav class="nav-links">
        <a href="index.html">Discover</a>
        <a href="library.html">Library</a>
        <a href="cart.html">Store</a>
    </nav>

    <div class="header-actions">
        <input type="text" placeholder="Artists, albums, tracks" class="search-bar">
        <div class="avatar"></div>
    </div>
</header>

<main class="player-page">

    <section class="player-main">

        <div class="player-art"></div>

        <h2>Starfall</h2>
        <p class="artist">Nova Pulse</p>

        <div class="progress-bar">
            <div class="progress"></div>
        </div>

        <div class="time-info">
            <span>1:12</span>
            <span>3:45</span>
        </div>

        <div class="player-controls">
            <button>🔀</button>
            <button>⏮</button>
            <button class="play-btn">▶</button>
            <button>⏭</button>
            <button>🔁</button>
        </div>

        <div class="volume-control">
            <span>🔊</span>
            <div class="volume-bar">
                <div class="volume-level"></div>
            </div>
        </div>

    </section>

    <!-- up next -->
    <aside class="up-next">
        <h3>Up Next</h3>

        <div class="queue-item active">
            <p>Starfall</p>
            <span>3:45</span>
        </div>

        <div class="queue-item">
            <p>Gravity Waves</p>
            <span>4:12</span>
        </div>

        <div class="queue-item">
            <p>Supernova Dreams</p>
            <span>5:01</span>
        </div>

    </aside>

</main>

</body>
</html>
